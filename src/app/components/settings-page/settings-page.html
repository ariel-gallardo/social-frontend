<section class="flex-1 h-full overflow-y-auto custom-scrollbar bg-slate-50 dark:bg-slate-900/50 p-4 sm:p-6 animate-fade-in">
  <div class="max-w-3xl mx-auto space-y-6">
    <h2 class="text-2xl font-bold">Settings</h2>

    <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-background-dark p-4 sm:p-6 space-y-4">
      <h3 class="text-lg font-semibold">Profile</h3>

      <div class="flex items-center gap-3">
        <img class="h-14 w-14 rounded-full object-cover" [src]="avatarPreviewUrl || avatarUrl || me?.avatarUrl" [alt]="fullName || 'avatar'" />
        <div>
          <p class="text-sm font-medium">Preview</p>
          <p class="text-xs text-slate-500">Update your name and profile photo</p>
        </div>
      </div>

      <div>
        <label class="block text-sm mb-1">Full name</label>
        <input class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-3 py-2"
          [(ngModel)]="fullName" />
      </div>

      <div>
        <label class="block text-sm mb-1">Avatar URL (optional)</label>
        <input class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-3 py-2"
          [(ngModel)]="avatarUrl" />
      </div>

      <div>
        <label class="block text-sm mb-1">Upload avatar image</label>
        <input type="file" accept="image/*" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-3 py-2"
          (change)="onAvatarSelected($event)" />
      </div>

      <p *ngIf="uploadErrorMessage" class="text-sm text-red-500">{{ uploadErrorMessage }}</p>

      <button class="px-4 py-2 rounded-lg bg-primary text-white hover:opacity-90" (click)="saveProfile()" [disabled]="isSavingProfile">
        {{ isSavingProfile ? 'Saving...' : 'Save profile' }}
      </button>

      <p *ngIf="profileMessage" class="text-sm text-slate-500">{{ profileMessage }}</p>
    </div>

    <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-background-dark p-4 sm:p-6 space-y-4">
      <h3 class="text-lg font-semibold">Password</h3>

      <div>
        <label class="block text-sm mb-1">Current password</label>
        <input type="password" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-3 py-2"
          [(ngModel)]="currentPassword" />
      </div>

      <div>
        <label class="block text-sm mb-1">New password</label>
        <input type="password" class="w-full rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent px-3 py-2"
          [(ngModel)]="newPassword" />
      </div>

      <button class="px-4 py-2 rounded-lg bg-primary text-white hover:opacity-90" (click)="savePassword()" [disabled]="isChangingPassword">
        {{ isChangingPassword ? 'Updating...' : 'Change password' }}
      </button>

      <p *ngIf="passwordMessage" class="text-sm text-slate-500">{{ passwordMessage }}</p>
    </div>
  </div>
</section>
