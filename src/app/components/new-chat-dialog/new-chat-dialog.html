<div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 animate-fade-in">
  <div class="bg-white dark:bg-background-dark rounded-2xl w-full max-w-md sm:max-w-lg mx-4 h-[36rem] min-h-[32rem] max-h-[90vh] flex flex-col animate-pop-in">
    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-slate-200 dark:border-slate-800">
      <h2 class="text-xl font-bold">New Chat</h2>
      <button (click)="onClose()" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full hover-lift">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <!-- Search -->
    <div class="p-4 border-b border-slate-200 dark:border-slate-800">
      <input
        class="w-full rounded-full border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 px-4 py-2 text-sm focus:ring-2 focus:ring-primary focus:border-transparent"
        placeholder="Search by name or username"
        type="text"
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearchTermChange()"
        (keyup.enter)="searchUsers(1)" />
    </div>

    <!-- Results -->
    <div class="flex-1 overflow-y-auto custom-scrollbar animate-fade-in">
      <div *ngIf="error" class="p-4 text-red-600 dark:text-red-400 text-sm animate-fade-in">
        {{ error }}
      </div>

      <div *ngIf="loading" class="p-4 text-center text-slate-500 animate-fade-in">
        <p class="animate-pulse">Loading...</p>
      </div>

      <div *ngIf="!loading && !error && searchTerm.trim() === '' && users.length === 0" class="p-4 text-center text-slate-400 text-sm">
        <p>No contacts available yet</p>
      </div>

      <div *ngIf="!loading && !error && searchTerm.trim() !== '' && users.length === 0" class="p-4 text-center text-slate-400 text-sm">
        <p>No users found</p>
      </div>

      <p *ngIf="!loading && users.length > 0" class="px-4 pt-3 text-xs text-slate-500">
        Showing {{ users.length }} of {{ totalElements }} people
      </p>

      <div *ngFor="let user of users"
        [class.hidden]="user.friendStatus?.status === 'BLOCKED' || user.friendStatus?.status === 'BLOCKED_BY_OTHER'"
        class="flex items-center gap-3 p-4 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors border-b border-slate-100 dark:border-slate-900 animate-fade-in">
        <div class="relative h-12 w-12 flex-shrink-0">
          <img class="h-full w-full rounded-full object-cover" [src]="user.avatarUrl" [alt]="user.fullName" />
          <div class="absolute bottom-0 right-0 h-3 w-3 rounded-full border-2 border-white dark:border-background-dark"
            [ngClass]="user.isActive ? 'bg-green-500' : 'bg-slate-400'"></div>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold truncate">{{ user.fullName }}</p>
          <p class="text-xs text-slate-400 truncate">@{{ user.username }}</p>
        </div>
        <div class="flex gap-2">
          <!-- Show Add button if not friend and no pending request -->
          <button
            *ngIf="user.friendStatus?.isFriend === false && user.friendStatus?.hasPendingRequest === false"
            (click)="addFriend(user, $event)"
            class="px-3 py-1 text-xs rounded-lg bg-blue-500 hover:bg-blue-600 text-white transition-colors">
            Add
          </button>
          
          <!-- Show Pending if request sent -->
          <button
            *ngIf="user.friendStatus?.hasPendingRequest === true"
            (click)="cancelPendingRequest(user, $event)"
            class="px-3 py-1 text-xs rounded-lg bg-slate-300 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-400 dark:hover:bg-slate-600 transition-colors">
            Pending
          </button>
          
          <!-- Show Chat button if friend -->
          <button
            *ngIf="user.friendStatus?.isFriend === true"
            (click)="startChat(user, $event)"
            class="px-3 py-1 text-xs rounded-lg bg-green-500 hover:bg-green-600 text-white transition-colors">
            Chat
          </button>
          
          <!-- Show status while loading -->
          <span
            *ngIf="user.loadingStatus"
            class="px-3 py-1 text-xs text-slate-400">
            ...
          </span>
        </div>
      </div>
    </div>

    <!-- Pagination (fixed at bottom) -->
    <div *ngIf="!loading && users.length > 0" class="flex items-center justify-between p-4 border-t border-slate-200 dark:border-slate-800">
      <button
        class="rounded-lg border border-slate-300 dark:border-slate-700 px-3 py-2 text-sm disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="!canGoPrevious"
        (click)="goToPreviousPage()">
        Previous
      </button>

      <p class="text-xs text-slate-500">Page {{ currentPage }} of {{ totalPages }}</p>

      <button
        class="rounded-lg border border-slate-300 dark:border-slate-700 px-3 py-2 text-sm disabled:opacity-50 disabled:cursor-not-allowed"
        [disabled]="!canGoNext"
        (click)="goToNextPage()">
        Next
      </button>
    </div>
  </div>
</div>
